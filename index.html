<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>개발 공부 블로그</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Noto+Sans+KR:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f8f6f2;
      --surface: #ffffff;
      --border: #e5e0d8;
      --text-primary: #1c1917;
      --text-secondary: #57534e;
      --text-muted: #a8a29e;
      --accent: #c2410c;
      --accent-hover: #9a3412;
      --tag-network: #dbeafe;
      --tag-network-text: #1e40af;
      --tag-정처기: #dcfce7;
      --tag-정처기-text: #166534;
      --tag-linux: #fef3c7;
      --tag-linux-text: #92400e;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .header-inner {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 28px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      text-decoration: none;
      letter-spacing: -0.2px;
    }
    .logo em { color: var(--accent); font-style: normal; }
    .header-meta {
      font-size: 12px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    /* ── Hero ── */
    .hero {
      max-width: 860px;
      margin: 0 auto;
      padding: 72px 28px 56px;
    }
    .hero-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--accent);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .hero-title {
      font-family: 'Noto Serif KR', serif;
      font-size: clamp(28px, 5vw, 42px);
      font-weight: 700;
      line-height: 1.25;
      color: var(--text-primary);
      margin-bottom: 16px;
    }
    .hero-desc {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.7;
      max-width: 480px;
    }

    /* ── Stats ── */
    .stats {
      max-width: 860px;
      margin: 0 auto 0;
      padding: 0 28px 40px;
      display: flex;
      gap: 32px;
    }
    .stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .stat-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      font-weight: 500;
      color: var(--text-primary);
    }
    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    /* ── Divider ── */
    .divider {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 28px;
      border: none;
      border-top: 1px solid var(--border);
    }

    /* ── Filter Tabs ── */
    .filter-wrap {
      max-width: 860px;
      margin: 0 auto;
      padding: 28px 28px 0;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 7px 18px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .filter-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 500;
    }

    /* ── Post List ── */
    .post-list {
      max-width: 860px;
      margin: 0 auto;
      padding: 24px 28px 80px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .post-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      color: inherit;
      transition: all 0.15s ease;
      gap: 16px;
    }
    .post-item:hover .post-title {
      color: var(--accent);
    }
    .post-item:hover .post-arrow {
      transform: translateX(4px);
      color: var(--accent);
    }
    .post-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }
    .post-tag {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .post-tag.network  { background: var(--tag-network);  color: var(--tag-network-text); }
    .post-tag.정처기    { background: var(--tag-정처기);    color: var(--tag-정처기-text); }
    .post-tag.linux    { background: var(--tag-linux);    color: var(--tag-linux-text); }

    .post-title {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-primary);
      transition: color 0.15s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .post-right {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }
    .post-date {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text-muted);
    }
    .post-arrow {
      font-size: 16px;
      color: var(--text-muted);
      transition: all 0.15s ease;
    }

    .empty-msg {
      text-align: center;
      padding: 60px 0;
      color: var(--text-muted);
      font-size: 14px;
      display: none;
    }

    @media (max-width: 560px) {
      .post-date { display: none; }
      .hero-title { font-size: 26px; }
      .stats { gap: 20px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <a class="logo" href="index.html">dev<em>.</em>log</a>
      <span class="header-meta">공부 기록</span>
    </div>
  </header>

  <section class="hero">
    <p class="hero-eyebrow">Study Blog</p>
    <h1 class="hero-title">공부한 것들을<br>기록합니다</h1>
    <p class="hero-desc">네트워크, 정보처리기사, 리눅스 등 개발 공부 내용을 정리한 블로그입니다.</p>
  </section>

  <div class="stats">
    <div class="stat">
      <span class="stat-num" id="total-count">0</span>
      <span class="stat-label">전체 글</span>
    </div>
    <div class="stat">
      <span class="stat-num">3</span>
      <span class="stat-label">카테고리</span>
    </div>
  </div>

  <hr class="divider" />

  <div class="filter-wrap">
    <button class="filter-btn active" data-filter="all">전체</button>
    <button class="filter-btn" data-filter="network">네트워크</button>
    <button class="filter-btn" data-filter="정처기">정처기</button>
    <button class="filter-btn" data-filter="linux">리눅스</button>
  </div>

  <ul class="post-list" id="post-list">

    <!--
    =============================================
    글 추가할 때 아래 형식으로 <li> 한 줄씩 추가하세요.
    data-category: network | 정처기 | linux
    =============================================
    -->    
  <li data-category="network">
    <a class="post-item" href="posts/network/001-OSI7계층.html">
      <div class="post-left">
        <span class="post-tag network">네트워크</span>
        <span class="post-title">OSI 7계층</span>
      </div>
      <div class="post-right">
        <span class="post-date">2026-05-22</span>
        <span class="post-arrow">→</span>
      </div>
    </a>
  </li>

    <!-- 예시: 아래처럼 추가하면 됩니다
    <li data-category="network">
      <a class="post-item" href="posts/network/001-OSI7계층.html">
        <div class="post-left">
          <span class="post-tag network">네트워크</span>
          <span class="post-title">OSI 7계층 완전 정리</span>
        </div>
        <div class="post-right">
          <span class="post-date">2026-05-22</span>
          <span class="post-arrow">→</span>
        </div>
      </a>
    </li>
    -->

  </ul>

  <p class="empty-msg" id="empty-msg">해당 카테고리에 글이 없습니다.</p>

  <script>
    // 카테고리 필터링
    const buttons = document.querySelectorAll('.filter-btn');
    const items = document.querySelectorAll('#post-list li');
    const emptyMsg = document.getElementById('empty-msg');
    const totalCount = document.getElementById('total-count');

    totalCount.textContent = items.length;

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const filter = btn.dataset.filter;
        let visible = 0;

        items.forEach(item => {
          const match = filter === 'all' || item.dataset.category === filter;
          item.style.display = match ? '' : 'none';
          if (match) visible++;
        });

        emptyMsg.style.display = visible === 0 ? 'block' : 'none';
      });
    });
  </script>

</body>
</html>
