<!DOCTYPE html>

  <link rel="preconnect" href="https://fonts.googleapis.com" />

<body>

  <header>
    <div class="header-inner">

      <nav class="site-nav">

        <a href="projects.html">Projects</a>
        <a href="blog.html" class="active">Blog</a>
        <a href="resume.html">Resume</a>
      </nav>

  <section class="hero">
