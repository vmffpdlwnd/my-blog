# 매일 06:00(한국시간) 노션의 새 글을 사이트에 반영한다.
# schedule은 항상 기본 브랜치(dev)에서 실행되는데, github-pages 환경은 main에서만 배포를 허용한다.
# 그래서 여기서는 배포하지 않고, Deploy 워크플로를 main 브랜치로 실행시키기만 한다.
# (이 파일은 기본 브랜치에 있어야 schedule이 동작한다)
name: Scheduled Deploy

on:
  schedule:
    - cron: '0 21 * * *'   # UTC 21:00 = 한국시간 06:00
  workflow_dispatch:

permissions:
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: main 브랜치로 Deploy 실행
        run: gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}