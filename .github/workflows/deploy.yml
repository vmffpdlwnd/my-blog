# 노션 글을 동기화하고 사이트를 빌드해서 GitHub Pages에 배포한다.
#  - main에 push: 배포
#  - 매일 06:00(한국시간) 자동 실행: scheduled-deploy.yml이 이 워크플로를 main으로 실행한다
#  - 수동 실행: Actions 탭 → Deploy → Run workflow (브랜치는 main 선택)
#  - Pull Request: 빌드까지만 확인 (배포하지 않음)
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 노션 글 동기화
        run: node scripts/notion-sync.js
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}

      - name: 글 목록(posts.json) 생성
        run: node scripts/build.js

      - name: 사이트 파일 모으기
        run: |
          mkdir _site
          cp -r index.html pages assets content data _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5